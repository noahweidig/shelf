name: Update shelves

on:
  push:
    branches: [main]
    paths:
      - 'docs/**.md'
      - 'scripts/shelves.py'
      # The tag vocabulary lives here, and the nav table is written back to it.
      - 'zensical.toml'
      # Its tag checkboxes are generated from that vocabulary.
      - '.github/ISSUE_TEMPLATE/add-book.yml'
  pull_request:
    paths:
      - 'docs/**.md'
      - 'scripts/shelves.py'
      # The tag vocabulary lives here, and the nav table is written back to it.
      - 'zensical.toml'
      # Its tag checkboxes are generated from that vocabulary.
      - '.github/ISSUE_TEMPLATE/add-book.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shelves-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shelves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the push step can rebase if main has moved on.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # On a pull request, only report: the branch is not ours to push to.
      - name: Check the shelves match the books
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/shelves.py --check || {
            echo "::error::A book changed shelves. Run 'python3 scripts/shelves.py' and commit the result."
            exit 1
          }

      - name: Rebuild the shelves from the book pages
        if: github.event_name != 'pull_request'
        run: python3 scripts/shelves.py

      - name: Commit any moved books
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Shelves already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move books to their shelves"

          # main may have moved while we were generating: rebase onto it,
          # regenerate against whatever books it now holds, and try again.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected, rebasing onto main (attempt $attempt)."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            python3 scripts/shelves.py
            git add -A
            git diff --cached --quiet || git commit --amend --no-edit
          done
          echo "::error::Could not push the regenerated shelves after 3 attempts."
          exit 1
