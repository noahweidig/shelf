name: Add a book

# Someone filed the "Add a book" issue form. Turn it into a book page and open
# a draft pull request, so the shelf is only ever changed by a reviewed merge.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: add-book-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  add-book:
    if: contains(github.event.issue.labels.*.name, 'book')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Write the issue body to a file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > issue-body.md

      - name: Build the book page
        id: build
        run: |
          set -o pipefail
          python3 scripts/add_book.py issue-body.md | tee build.log
          echo "page=$(sed -n 's/^created: //p' build.log)" >> "$GITHUB_OUTPUT"

      - name: Run the shelves script
        run: python3 scripts/shelves.py

      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          PAGE: ${{ steps.build.outputs.page }}
        run: |
          set -euo pipefail
          rm -f issue-body.md build.log
          branch="book/issue-${ISSUE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Add ${PAGE#docs/}" -m "Closes #${ISSUE}"
          git push -u origin "$branch" --force-with-lease
          gh pr create \
            --draft \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "${TITLE}" \
            --body "Generated from #${ISSUE} by the **Add a book** workflow.

          \`${PAGE}\` was written from the issue form, then \`scripts/shelves.py\`
          rebuilt the shelf pages and the \`nav\` table. Edit the page on this
          branch if anything needs fixing, then merge.

          Closes #${ISSUE}"

      - name: Report back on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "The **Add a book** workflow could not
          build this page — see [the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          for the error. Editing the issue and re-applying the \`book\` label runs it again."
