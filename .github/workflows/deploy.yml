name: Deploy site

on:
  push:
    branches: [main]
  # A push made by "Update shelves" does not itself trigger a push event,
  # so deploy once that workflow has finished moving books.
  workflow_run:
    workflows: [Update shelves]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build with Zensical
        run: zensical build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
