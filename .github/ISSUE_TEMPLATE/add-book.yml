name: Add a book
description: Put a book on the shelf. Opens a pull request with the page already written.
title: "Add a book"
labels: ["book"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in and the **Add a book** workflow writes `docs/<slug>.md`,
        reruns `scripts/shelves.py`, and opens a draft pull request for you.
        Nothing is published until you merge it.

  - type: input
    id: title
    attributes:
      label: Title
      description: The book's title, exactly as it appears on the cover.
      placeholder: The Hobbit
    validations:
      required: true

  - type: input
    id: subtitle
    attributes:
      label: Subtitle
      description: The secondary title, if it has one. Shown in italics under the heading.
      placeholder: There and Back Again

  - type: input
    id: author
    attributes:
      label: Author
      placeholder: J. R. R. Tolkien
    validations:
      required: true

  - type: dropdown
    id: shelf
    attributes:
      label: Shelf
      description: Which shelf it goes on.
      options:
        - Want to read
        - Currently reading
        - Previously read
      default: 0
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - Audiobook
        - Physical
        - Not sure yet
      default: 0
    validations:
      required: true

  - type: input
    id: narrator
    attributes:
      label: Narrator
      description: Audiobooks only — who reads it.
      placeholder: Andy Serkis

  - type: input
    id: years
    attributes:
      label: Year(s) finished
      description: >-
        Previously read only. One year, or several separated by commas if you
        have read it more than once.
      placeholder: "2026"

  - type: dropdown
    id: rating
    attributes:
      label: Rating
      description: Out of five. Leave unrated if you would rather not score it.
      options:
        - Unrated
        - 1
        - 2
        - 3
        - 4
        - 5
      default: 0

  - type: checkboxes
    id: tags
    attributes:
      label: Tags
      description: >-
        Pick the ones that fit — usually a genre or two, plus a form tag like
        Classics, Series or Short stories. This list is generated from
        `[project.extra.tags]` in `zensical.toml`; edit it there, not here.
      options:
        # tags: generated by scripts/shelves.py
        - label: Adventure
        - label: Biography
        - label: Business
        - label: Classics
        - label: Communication
        - label: Economics
        - label: Faith
        - label: Fantasy
        - label: Food
        - label: Health
        - label: History
        - label: Humor
        - label: Literary fiction
        - label: Memoir
        - label: Mystery
        - label: Mythology
        - label: Nature
        - label: Philosophy
        - label: Politics
        - label: Productivity
        - label: Psychology
        - label: Science
        - label: Science fiction
        - label: Self-improvement
        - label: Series
        - label: Short stories
        - label: Spirituality
        - label: Technology
        - label: Theology
        - label: Writing
        # end tags

  - type: textarea
    id: notes
    attributes:
      label: Thoughts
      description: >-
        Anything you want on the page, in plain markdown. Leave it empty and the
        page says so until you come back to it.
      placeholder: What you made of it.
